name: Feature request
description: Something the app should do that it does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas belong here. Code comes from the maintainers, so an unrequested
        pull request is closed unread. See CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: What goes wrong for you today
      description: The situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like instead
    validations:
      required: true
